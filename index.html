<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hannia - Hello Kitty 🎀</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --red: #e4002b;
            --red-dark: #b8001f;
            --pink: #ffc2d4;
            --pink-soft: #fff0f5;
            --pink-line: #ff8fb1;
            --blue: #7fa8ee;
            --blue-soft: #eaf3ff;
            --yellow: #ffcf33;
            --yellow-soft: #fff8dc;
            --white: #fff;
            --ink: #4a2f38;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Quicksand', sans-serif;
            color: var(--ink);
            background-color: #fff;
            background-image:
                linear-gradient(90deg, rgba(255, 143, 177, .38) 50%, transparent 50%),
                linear-gradient(rgba(255, 143, 177, .38) 50%, transparent 50%);
            background-size: 56px 56px;
            background-attachment: fixed;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .main-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 96px 16px 40px;
        }

        /* ---------- Tarjeta principal ---------- */
        .welcome-box {
            position: relative;
            width: 100%;
            max-width: 470px;
            padding: 84px 30px 34px;
            text-align: center;
            background: rgba(255, 255, 255, .95);
            border: 5px solid var(--red);
            border-radius: 44px;
            box-shadow: 0 11px 0 var(--pink-line), 0 24px 40px rgba(228, 0, 43, .14);
            animation: pop .9s cubic-bezier(.2, 1.4, .4, 1) both;
        }

        @keyframes pop {
            from { opacity: 0; transform: translateY(30px) scale(.9); }
            to   { opacity: 1; transform: none; }
        }

        /* Costura interior */
        .welcome-box::before {
            content: '';
            position: absolute;
            inset: 9px;
            border: 3px dashed var(--pink-line);
            border-radius: 34px;
            pointer-events: none;
        }

        /* ---------- Hello Kitty ---------- */
        .kitty-wrap {
            position: absolute;
            top: -78px;
            left: 50%;
            width: 138px;
            margin-left: -69px;
            cursor: pointer;
            filter: drop-shadow(0 6px 0 rgba(228, 0, 43, .14));
        }
        .kitty-wrap:focus-visible { outline: 4px solid var(--yellow); outline-offset: 5px; border-radius: 34px; }
        .kitty { width: 100%; height: auto; display: block; overflow: visible; }
        .kitty .head-group { transform-origin: 100px 150px; animation: tilt 3.6s ease-in-out infinite; }
        .kitty .eye { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
        .kitty-wrap.pop .head-group { animation: hop .5s ease-out; }

        @keyframes tilt  { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
        @keyframes blink { 0%, 91%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.08); } }
        @keyframes hop {
            0%   { transform: translateY(0) scale(1); }
            35%  { transform: translateY(-16px) scale(1.06, .96); }
            100% { transform: translateY(0) scale(1); }
        }

        h1 {
            margin: 0;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: clamp(3rem, 13vw, 4.4rem);
            line-height: 1;
            color: var(--red);
            -webkit-text-stroke: 9px var(--white);
            paint-order: stroke fill;
            text-shadow: 0 6px 0 var(--pink-line);
        }

        .intro-text {
            display: inline-block;
            margin: 20px 0 26px;
            padding: 7px 22px;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--white);
            background: var(--red);
            border-radius: 999px;
            box-shadow: 0 4px 0 var(--red-dark);
        }

        /* ---------- Menú ---------- */
        .menu-links {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .nav-card {
            --bg: var(--pink-soft);
            --bd: var(--pink-line);
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            text-align: left;
            text-decoration: none;
            color: var(--ink);
            background: var(--bg);
            border: 3px solid var(--bd);
            border-radius: 28px;
            box-shadow: 0 5px 0 var(--bd);
            transition: transform .18s ease, box-shadow .18s ease;
        }
        .nav-card:nth-child(2) { --bg: var(--blue-soft);   --bd: var(--blue); }
        .nav-card:nth-child(3) { --bg: var(--yellow-soft); --bd: var(--yellow); }

        /* Mini moño en cada tarjeta */
        .nav-card::before {
            content: '';
            position: absolute;
            top: -14px;
            right: 16px;
            width: 40px;
            height: 26px;
            transform: rotate(12deg);
            background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 26'><ellipse cx='11' cy='13' rx='10' ry='8' fill='%23e4002b' transform='rotate(-15 11 13)'/><ellipse cx='29' cy='13' rx='10' ry='8' fill='%23e4002b' transform='rotate(15 29 13)'/><circle cx='20' cy='14' r='5' fill='%23ff5b7a'/></svg>") center / contain no-repeat;
        }

        .nav-card:hover { transform: translateY(-4px); box-shadow: 0 9px 0 var(--bd); }
        .nav-card:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--bd); }
        .nav-card:focus-visible { outline: 4px solid var(--yellow); outline-offset: 3px; }

        .nav-icon {
            flex: none;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            background: var(--white);
            border: 3px solid var(--bd);
            border-radius: 50%;
        }

        .nav-title {
            display: block;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 1.2rem;
            line-height: 1.15;
            color: var(--red);
        }

        .nav-sub {
            display: block;
            margin-top: 3px;
            font-size: .9rem;
            font-weight: 700;
            opacity: .8;
        }

        .nav-arrow {
            margin-left: auto;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--red);
        }

        /* ---------- Flotantes y chispas ---------- */
        .floating-item {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
            user-select: none;
            pointer-events: none;
            animation: floatUp var(--duration) linear infinite;
        }
        @keyframes floatUp {
            0%   { transform: translateY(105vh) rotate(0deg); opacity: 0; }
            10%  { opacity: .9; }
            100% { transform: translateY(-12vh) rotate(360deg); opacity: 0; }
        }

        .burst {
            position: fixed;
            z-index: 50;
            pointer-events: none;
            font-size: 1.4rem;
            animation: burst .9s ease-out forwards;
        }
        @keyframes burst {
            0%   { transform: translate(-50%, -50%) scale(.6); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--dx)), calc(-50% - 90px)) scale(1.3); opacity: 0; }
        }

        @media (max-width: 600px) {
            .main-container { padding-top: 92px; }
            .welcome-box { padding: 82px 18px 28px; border-radius: 36px; }
            .welcome-box::before { border-radius: 27px; inset: 8px; }
            .kitty-wrap { width: 118px; margin-left: -59px; top: -68px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .floating-item { display: none; }
            .welcome-box { animation: none; }
            .kitty .head-group, .kitty .eye { animation: none; }
            .burst { animation-duration: .01s; }
            * { transition: none !important; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="welcome-box">

            <div class="kitty-wrap" id="kitty" role="button" tabindex="0" aria-label="Hello Kitty. Tócala para que salte">
                <svg class="kitty" viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <g class="head-group" stroke="#3b2a30" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
                        <path d="M40 76 L33 24 Q33 15 42 19 L92 46 Z" fill="#fff"/>
                        <path d="M160 76 L167 24 Q167 15 158 19 L108 46 Z" fill="#fff"/>
                        <ellipse cx="100" cy="104" rx="82" ry="60" fill="#fff"/>
                        <ellipse class="eye" cx="64" cy="106" rx="6.5" ry="8" fill="#3b2a30" stroke="none"/>
                        <ellipse class="eye" cx="136" cy="106" rx="6.5" ry="8" fill="#3b2a30" stroke="none"/>
                        <ellipse cx="100" cy="118" rx="9" ry="6" fill="#ffcf33" stroke-width="3.5"/>
                        <g fill="none" stroke-width="3.5">
                            <path d="M14 94 L42 101"/><path d="M10 111 L42 111"/><path d="M14 128 L42 121"/>
                            <path d="M186 94 L158 101"/><path d="M190 111 L158 111"/><path d="M186 128 L158 121"/>
                        </g>
                        <g stroke="#8f0018" stroke-width="3.5">
                            <ellipse cx="127" cy="38" rx="20" ry="14" fill="#e4002b" transform="rotate(-22 127 38)"/>
                            <ellipse cx="171" cy="36" rx="20" ry="14" fill="#e4002b" transform="rotate(22 171 36)"/>
                            <circle cx="149" cy="42" r="10" fill="#ff3b5c"/>
                        </g>
                        <ellipse cx="122" cy="31" rx="8" ry="3.5" fill="#ff8aa0" stroke="none" transform="rotate(-22 122 31)"/>
                        <ellipse cx="176" cy="29" rx="8" ry="3.5" fill="#ff8aa0" stroke="none" transform="rotate(22 176 29)"/>
                    </g>
                </svg>
            </div>

            <h1>Hannia</h1>
            <p class="intro-text">🎀 ¡Bienvenida! 🎀</p>

            <nav class="menu-links" aria-label="Menú principal">
                <a href="carta.html" class="nav-card">
                    <span class="nav-icon" aria-hidden="true">✉️</span>
                    <span>
                        <span class="nav-title">Mi carta para ti</span>
                        <span class="nav-sub">Ábrela cuando quieras</span>
                    </span>
                    <span class="nav-arrow" aria-hidden="true">›</span>
                </a>
                <a href="tamo.html" class="nav-card">
                    <span class="nav-icon" aria-hidden="true">🌎</span>
                    <span>
                        <span class="nav-title">Te amo en el mundo</span>
                        <span class="nav-sub">Cien idiomas, un solo mensaje</span>
                    </span>
                    <span class="nav-arrow" aria-hidden="true">›</span>
                </a>
                <a href="flores.html" class="nav-card">
                    <span class="nav-icon" aria-hidden="true">💐</span>
                    <span>
                        <span class="nav-title">Flores</span>
                        <span class="nav-sub">Planta tu propio campo</span>
                    </span>
                    <span class="nav-arrow" aria-hidden="true">›</span>
                </a>
            </nav>
        </div>
    </div>

    <script>
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const pick = arr => arr[Math.floor(Math.random() * arr.length)];

        function burst(x, y, n = 7) {
            if (reduceMotion) return;
            const icons = ['💖', '🎀', '🍎', '💗', '⭐'];
            for (let i = 0; i < n; i++) {
                const s = document.createElement('span');
                s.className = 'burst';
                s.textContent = pick(icons);
                s.style.left = x + 'px';
                s.style.top = y + 'px';
                s.style.setProperty('--dx', (Math.random() * 140 - 70) + 'px');
                s.style.animationDelay = (i * 45) + 'ms';
                document.body.appendChild(s);
                setTimeout(() => s.remove(), 1200);
            }
        }

        // Hello Kitty salta y suelta corazones
        const kitty = document.getElementById('kitty');
        function kittyHop() {
            kitty.classList.remove('pop');
            void kitty.offsetWidth;
            kitty.classList.add('pop');
            const r = kitty.getBoundingClientRect();
            burst(r.left + r.width / 2, r.top + r.height / 3);
        }
        kitty.addEventListener('click', kittyHop);
        kitty.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); kittyHop(); }
        });

        // Íconos flotantes de fondo
        const icons = ['🎀', '🍎', '💖', '🍓', '⭐', '🥛', '🐾', '🍰'];
        for (let i = 0; i < 20; i++) {
            const item = document.createElement('div');
            item.className = 'floating-item';
            item.textContent = pick(icons);
            item.style.fontSize = (Math.random() * 14 + 18) + 'px';
            item.style.left = Math.random() * 96 + 'vw';
            item.style.setProperty('--duration', (Math.random() * 7 + 8) + 's');
            item.style.animationDelay = (-Math.random() * 12) + 's';
            document.body.appendChild(item);
        }
    </script>
</body>
</html>
